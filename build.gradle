// ===========================================================================
//  RecipeBalancer · MC 1.16.5 + Forge 36.2.x
//
//  为什么不是 MDG：ModDevGradle 的 legacy 插件官方支持范围是 Forge 1.17–1.20.1，
//  1.16.5 不在内。这一代只能用 ForgeGradle 5（配套 Gradle 7.6，见 wrapper 配置）。
// ===========================================================================
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java-library'
apply plugin: 'idea'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 1.16.5 是 Java 8 世代：这一行同时是「语法上限」——record / switch 箭头 /
// isBlank / 模式匹配在编译期就会被拦下来（移植时必须降到 Java 8 子集）。
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

// ---------------------------------------------------------------------------
// 移植期门禁：`gradlew test -PcoreOnly`
//
// 只编译 core（以及 core 的测试），用来单独验证「算法在 Java 8 下的结果与 1.18.2 一致」——
// mc 层还没移完时也能跑金标准对拍。正常构建/发布**不加**这个参数，产物不受影响。
// ---------------------------------------------------------------------------
if (project.hasProperty('coreOnly')) {
    sourceSets.main.java.exclude 'com/jessetech/recipebalancer/mc/**'
    sourceSets.main.java.exclude 'com/jessetech/recipebalancer/RecipeBalancerMod.java'
    sourceSets.test.java.exclude 'com/jessetech/recipebalancer/mc/**'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
}

minecraft {
    // 1.16.5 的官方推荐映射（MCP snapshot）。这一代还没有 Mojang official 映射。
    mappings channel: 'snapshot', version: '20210309-1.16.5'

    // 纯客户端模组：只声明 client 运行配置（服务端/数据生成配置对本项目无意义）。
    runs {
        client {
            // 各版本线独立 run 目录，切分支互不串味
            workingDirectory project.file('1_16_5_forge')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

configurations {
    // 只用于「解包进模组 jar」的库；不参与 mod 依赖声明。
    // 1.16.5 没有 JarJar，commons-math3 直接解包进产物 jar（与本仓库其它分支一致）。
    shaded
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"

    // ------------------------------------------------------------------
    // JEI（1.16.5 只有 Forge 侧有；可选依赖）。
    //
    // 编译基线故意选最老的 7.6.1.75：只允许使用该版本就存在的 API，
    // 这样同一份代码在 7.6.1 ~ 7.8.1 全区间可加载。更高版本才有的能力
    // 一律走运行期探测，不在主源码集里编译期引用。
    //
    // compileOnly：JEI 的类不进入产物 jar，未装 JEI 时由能力探测短路。
    // dev 的 runClient 不能用来验证 JEI（JEI 的 config 注册在 userdev 会抛异常），
    // 带 JEI 的验证统一放实机实例（1.16.5-Forge）。
    // ------------------------------------------------------------------
    compileOnly files("libs/jei-api/jei-${jei_baseline_version}.jar")

    // ------------------------------------------------------------------
    // LP 求解器：Apache Commons Math（纯 Java simplex）。
    // implementation：dev 运行期 classpath；
    // shaded：构建时把类**直接解包进模组 jar**。
    // ------------------------------------------------------------------
    implementation 'org.apache.commons:commons-math3:3.6.1'
    shaded 'org.apache.commons:commons-math3:3.6.1'

    // ------------------------------------------------------------------
    // Gson：core/io 场景 JSON 序列化。
    //
    // 编译基线直接锁「1.16.5 运行期自带的那一份」（libs/gson/gson-2.8.0.jar）：
    // 用更高版本（例如 2.10）编译会悄悄引用 2.8.6+ 才有的静态方法
    // （JsonParser.parseString），运行期就是 NoSuchMethodError —— 这个坑已经踩过一次。
    // compileOnly：运行期由 Minecraft 提供；testImplementation：纯 JVM 测试自己带。
    // ------------------------------------------------------------------
    compileOnly files("libs/gson/gson-${gson_version}.jar")
    testImplementation files("libs/gson/gson-${gson_version}.jar")

    // ------------------------------------------------------------------
    // JUnit 5：core/ 金标准对拍（不启动游戏、不加载 MC 类）。
    // ------------------------------------------------------------------
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 只用于 @Nullable 注解（CLASS 保留，不进产物）。FG5 不像 MDG 会自动带进来。
    compileOnly 'org.jetbrains:annotations:23.0.0'
}

// 把 shaded 库的 class 直接并入模组 jar；排除 META-INF 避免签名/清单冲突。
tasks.named('jar') {
    from({ configurations.shaded.collect { zipTree(it) } }) {
        exclude 'META-INF/**'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

// 纯 JVM 测试：不依赖 runClient / FG5 的 dev 运行时。
tasks.named('test') {
    useJUnitPlatform()
    finalizedBy 'deployToTestInstance'
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
        showStackTraces = true
    }
}

// ---------------------------------------------------------------------------
// 实机测试部署：`gradlew test` 结束后把 jar 复制到 HMCL 实例的 mods/。
// 实例路径来自 gradle.properties 的 test_instance_dir；目录不存在时跳过
//（CI / 没有该实例的环境不会失败）。复制前先删掉旧的 recipebalancer-*.jar。
// ---------------------------------------------------------------------------
tasks.register('deployToTestInstance', Copy) {
    // FG5 在 jar 之后还有一遍 reobfJar（SRG 重映射），它才是 build/libs 里的最终产物；
    // 只依赖 jar 会触发 Gradle 的「隐式依赖」校验错误。
    dependsOn tasks.matching { it.name in ['jar', 'reobfJar'] }
    onlyIf {
        def instance = project.findProperty('test_instance_dir')
        instance != null && !instance.toString().trim().isEmpty() && project.file(instance).isDirectory()
    }
    from layout.buildDirectory.file("libs/${mod_id}-${mod_version}.jar")
    into { project.file("${project.findProperty('test_instance_dir')}/mods") }
    doFirst {
        def modsDir = project.file("${project.findProperty('test_instance_dir')}/mods")
        def current = "${mod_id}-${mod_version}.jar"
        // 只清理其它版本的旧 jar；当前版本交给 Copy 覆盖，避免复制失败后实例里一个都不剩
        modsDir.listFiles()?.findAll {
            it.name.startsWith("${mod_id}-") && it.name.endsWith(".jar") && it.name != current
        }?.each { it.delete() }
        logger.lifecycle("[RecipeBalancer] 已部署到实机实例: ${modsDir}")
    }
}

// ---------------------------------------------------------------------------
// 生成模组元数据
//
// ★ filteringCharset = 'UTF-8' 是必须的 ★
// ProcessResources 做占位符替换(expand)时默认用「平台默认编码」，
// 中文 Windows 上是 GBK，会把 UTF-8 模板里的中文转坏（字节被替换成 '?'），
// 产出非法 UTF-8 文件 → FML 解析 mods.toml 时抛
//   MalformedInputException: Input length = 2
// → 游戏报 "File ... is not a valid mod file"
// ---------------------------------------------------------------------------
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            jei_version_range      : jei_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 让运行任务的子进程输出直接接到 Gradle 控制台。
// 否则游戏崩溃时只会显示「退出码非零」，子进程的 stderr 会被吞掉。
tasks.matching { it.name in ['runClient'] }.configureEach {
    standardOutput = System.out
    errorOutput = System.err
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
