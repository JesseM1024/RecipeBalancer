plugins {
    id 'java-library'
    // 1.20.1 分支：用官方 legacy 插件编译，1.20.1 世代的 Forge / NeoForge 由它支持
    // （主插件 net.neoforged.moddev 面向 1.20.2+，本分支不使用）。
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 1.20.1 对应 Java 17（main 线 1.21.1 是 21）
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    // MDG legacy 插件已自动带上 Minecraft / Forge / NeoForge 仓库。
    // Maven Central：commons-math3 / gson / junit。
    mavenCentral()
}

legacyForge {
    // NeoForge 1.20.1 线：用 enable { } 指定平台版本
    enable {
        neoForgeVersion = project.neo_version
    }

    // 本项目是【纯客户端】模组（@Mod(dist = Dist.CLIENT)），
    // 因此只声明 client 运行配置 —— 服务端/数据生成配置对本项目无意义。
    runs {
        client {
            client()
        }
        configureEach {
            // 各版本线独立 run 目录，切分支互不串味：
            // 本分支（1.20.1）用 1_20_1_neo/，main（1.21.1）仍用默认 run/。
            gameDirectory = project.file('1_20_1_neo')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // 只用于“解包进模组 jar”的库；不参与 mod 依赖声明
    shaded
}

// legacy 线专用：1.20.1 生产环境是 SRG 映射，本地依赖的 mod jar 需要
// 从 SRG 重映射到官方映射后才能参与编译/运行（本项目管理内无 mod 依赖，属预防性配置）。
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    // ------------------------------------------------------------------
    // JEI（1.20.1 只有 Forge 侧有；可选依赖）。
    //
    // 编译基线故意选最老的 15.3.0.8：只允许使用该版本就存在的 API，
    // 这样同一份代码在 15.3 ~ 15.74 全区间可加载。更高版本才有的能力
    // （IClickableIngredientFactory / IRecipeButtonControllerFactory 等）
    // 一律走 mezz.jei.mc.JeiCapabilities 的运行期探测，不在编译期引用。
    //
    // compileOnly：JEI 的类不进入产物 jar，未装 JEI 时由能力探测短路。
    // ------------------------------------------------------------------
    compileOnly files("libs/jei-api/jei-1.20.1-forge-${jei_baseline_version}.jar")
    // 说明：dev 的 runClient 不能用来验证 JEI 集成。实测把 JEI 放进 localRuntime 后，
    // JEI 自身的 config 注册在 userdev 环境会抛异常（JEI 只支持正式环境），
    // 因此带 JEI 的验证统一放到实机实例（1.20.1-Forge）。

    // ------------------------------------------------------------------
    // LP 求解器：Apache Commons Math（纯 Java simplex）。
    // implementation：dev 运行期 classpath；
    // shaded：构建时把类**直接解包进模组 jar**（不依赖 JarJar/嵌套 jar）。
    // ------------------------------------------------------------------
    implementation 'org.apache.commons:commons-math3:3.6.1'
    shaded 'org.apache.commons:commons-math3:3.6.1'

    // ------------------------------------------------------------------
    // Gson：core/io 场景 JSON 序列化（契约 C1 允许的依赖）。
    // compileOnly：运行期由 Minecraft/平台自带 Gson 提供，避免版本冲突；
    // testImplementation：纯 JVM 测试不启动游戏，必须自己带到 classpath。
    // ------------------------------------------------------------------
    compileOnly "com.google.code.gson:gson:${gson_version}"
    testImplementation "com.google.code.gson:gson:${gson_version}"

    // ------------------------------------------------------------------
    // JUnit 5：core/ 金标准对拍（D1：不启动游戏、不加载 MC 类）。
    // ------------------------------------------------------------------
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---------------------------------------------------------------------------
// jeiModern 源码集：只放「较新 JEI 才有」的实现（官方配方页按钮 API；本地样本 15.21 无 / 15.48 有，精确界限未验证）。
//
// 为什么单独一个源码集：老版本 JEI 没有 IRecipeButtonControllerFactory /
// IIconButtonController，这些类若编译进主源码集会让整个插件编译不过；
// 放进独立源码集后用最新版 JEI 编译，运行时由 JeiCapabilities 探测决定是否加载
// （老版本上这些类永远不会被 Class.forName 到）。
// ---------------------------------------------------------------------------
configurations {
    jeiModernCompile
}

dependencies {
    jeiModernCompile files("libs/jei-api/jei-1.20.1-forge-${jei_verify_version}.jar")
}

sourceSets {
    jeiModern {
        java.srcDir 'src/jeiModern/java'
        // 平台依赖沿用主源码集，但把「编译基线 JEI」剔除，换成最新版 JEI
        compileClasspath = sourceSets.main.output + configurations.jeiModernCompile +
                configurations.compileClasspath.filter { !it.name.startsWith('jei-1.20.1-forge-') }
    }
}

// 注意：不能把 jeiModern 的输出挂进 sourceSets.main.output —— 那会让
// compileJeiModernJava（依赖 main.output）与 classes（依赖所有 output）互相依赖。
// 这些类只需要进产物 jar，所以直接在 jar 任务里追加即可。

// ---------------------------------------------------------------------------
// 把 shaded 库的 class 直接并入模组产物；排除 META-INF 避免签名/清单冲突。
//
// legacy(1.20.1) 线的额外要求：dev 运行时 FML 的 game layer 只认 legacyClasspath
// （MDG 生成的 clientLegacyClasspath.txt），Gradle 的 implementation 依赖虽然躺在
// JVM 的 -cp 里，但模组类加载器看不到 —— 实测 mod 构造期 Class.forName 抛
// ClassNotFoundException。所以把 shaded 类解包进一个**额外的 sourceSet 输出目录**，
// 让它跟着 mod 文件夹一起进 dev 运行时，同时也自然成为 jar 的一部分。
// ---------------------------------------------------------------------------
def shadedClassesDir = layout.buildDirectory.dir('shaded-classes')
var unpackShaded = tasks.register('unpackShadedClasses', Copy) {
    from({ configurations.shaded.collect { zipTree(it) } })
    into shadedClassesDir
    exclude 'META-INF/**'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
sourceSets.main.output.dir(shadedClassesDir, builtBy: unpackShaded)

tasks.named('jar') {
    // 解包任务是 sourceSet 输出的一部分，但显式依赖 + 显式 from 更可靠：
    // 否则 Gradle 可能判定 jar 已是最新，产出缺类的包。
    dependsOn unpackShaded
    from shadedClassesDir
    // jeiModern（官方配方页按钮 API）只进产物 jar，老版本 JEI 上不会被加载
    dependsOn 'compileJeiModernJava'
    from sourceSets.jeiModern.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// 纯 JVM 测试：不依赖 runClient / MDG 的 dev 运行时。
// 测试结束后自动把 jar 部署到实机 HMCL 实例（见文件末尾 deployToTestInstance）。
tasks.named('test') {
    useJUnitPlatform()
    finalizedBy 'deployToTestInstance'
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
        showStackTraces = true
    }
}

// ---------------------------------------------------------------------------
// 实机测试部署：`gradlew test` / `build` 结束后把 jar 复制到 HMCL 实例的 mods/。
// 实例路径来自 gradle.properties 的 test_instance_dirs（分号或逗号分隔多个实例）；
// 不存在的实例直接跳过（CI / 没有该实例的环境不会失败）。
// 复制前先删掉实例里其它版本的 recipebalancer-*.jar，避免多版本混装。
//
// legacy 线注意：build/libs 里的产物由 :reobfJar 覆盖写回（SRG 重混淆），
// 所以这里必须显式依赖 reobfJar，否则 Gradle 会报隐式依赖错误、也可能拷到未重混淆的 jar。
// ---------------------------------------------------------------------------
tasks.register('deployToTestInstance') {
    group = 'build'
    description = '把构建出的 jar 部署到 1.20.1 测试实例（NeoForge / Forge）'
    dependsOn tasks.named('reobfJar')

    var jarProvider = layout.buildDirectory.file("libs/${mod_id}-${mod_version}.jar")
    var instances = (project.findProperty('test_instance_dirs') ?: '')
            .toString().split(/[;,]/).collect { it.trim() }.findAll { !it.isEmpty() }
    inputs.file(jarProvider)

    doLast {
        var jar = jarProvider.get().asFile
        if (!jar.isFile()) {
            throw new GradleException("未找到构建产物: ${jar}")
        }
        var deployed = 0
        instances.each { String instance ->
            var instanceDir = project.file(instance)
            if (!instanceDir.isDirectory()) {
                logger.lifecycle("[RecipeBalancer] 跳过（实例不存在）: ${instance}")
                return
            }
            var modsDir = project.file("${instance}/mods")
            modsDir.mkdirs()
            modsDir.listFiles()?.findAll {
                it.name.startsWith("${mod_id}-") && it.name.endsWith(".jar") && it.name != jar.name
            }?.each { it.delete() }
            project.copy {
                from jar
                into modsDir
            }
            deployed++
            logger.lifecycle("[RecipeBalancer] 已部署到实例: ${modsDir}")
        }
        if (deployed == 0) {
            logger.lifecycle("[RecipeBalancer] 未部署：请检查 gradle.properties 的 test_instance_dirs")
        }
    }
}

// ---------------------------------------------------------------------------
// 生成模组元数据
//
// ★ filteringCharset = 'UTF-8' 是必须的 ★
// ProcessResources 做占位符替换(expand)时默认用「平台默认编码」，
// 中文 Windows 上是 GBK，会把 UTF-8 模板里的中文转坏（字节被替换成 '?'），
// 产出非法 UTF-8 文件 → FML 解析 mods.toml 时抛
//   MalformedInputException: Input length = 2
// → 游戏报 "File ... is not a valid mod file"
//
// 1.20.1 世代元数据文件名是 META-INF/mods.toml（neoforge.mods.toml 是 1.20.4+ 的名字）。
// ---------------------------------------------------------------------------
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            jei_version_range      : jei_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 让运行任务的子进程输出直接接到 Gradle 控制台。
// 否则游戏崩溃时只会显示"退出码非零"，子进程的 stderr 会被吞掉。
tasks.matching { it.name in ['runClient'] }.configureEach {
    standardOutput = System.out
    errorOutput = System.err
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
