plugins {
    id 'java-library'
    // 1.18.2 分支：MDG 主插件只支持 NeoForge 1.20.2+，1.18.2 没有 NeoForge，
    // 走同一家官方的 legacy 插件（官方支持 Forge 1.17–1.20.1）。
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 1.18.2 对应 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    // MDG legacy 插件已自动带上 Minecraft / Forge 仓库，本分支无第三方 mod 依赖。
    mavenCentral()
}

legacyForge {
    // 1.18.2 线：Forge 本体（这一代没有 NeoForge）。
    // 2.0.147 里这三个是 enable { } 块上的三选一属性：
    //   forgeVersion（Forge 线）/ neoForgeVersion（NeoForge 1.20.1）/ mcpVersion（原版线）。
    enable {
        forgeVersion = project.forge_version
    }

    // 本项目是【纯客户端】模组（@Mod 无 dist 参数，构造时检查 FMLEnvironment.dist），
    // 因此只声明 client 运行配置 —— 服务端/数据生成配置对本项目无意义。
    runs {
        client {
            client()
        }
        configureEach {
            // 各版本线独立 run 目录，切分支互不串味：
            // 本分支（1.18.2）用 1_18_2_forge/，1.20.1 线用 1_20_1_neo/。
            gameDirectory = project.file('1_18_2_forge')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // 只用于“解包进模组 jar”的库；不参与 mod 依赖声明
    shaded
    // jeiModern 源码集专用：高版本 JEI（10.x）才有的 API
    jeiModernCompile
}

// legacy 线专用：1.18.2 生产环境是 SRG 映射，本地依赖的 mod jar 也需要
// 从 SRG 重映射到官方映射后才能参与编译/运行（本项目管理内无 mod 依赖，属预防性配置）。
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    // ------------------------------------------------------------------
    // JEI（1.18.2 只有 Forge 侧有；可选依赖）。
    //
    // 编译基线故意选最老的 9.4.1.113：只允许使用该版本就存在的 API，
    // 这样同一份代码在 9.4 ~ 10.81 全区间可加载。更高版本才有的能力
    // （IRecipeButtonControllerFactory / IRecipeCategoryDecorator / IClickableIngredientFactory）
    // 一律走 mc/jei/JeiCapabilities 的运行期探测，不在主源码集里编译期引用。
    //
    // compileOnly：JEI 的类不进入产物 jar，未装 JEI 时由能力探测短路。
    // dev 的 runClient 不能用来验证 JEI（JEI 的 config 注册在 userdev 会抛异常），
    // 带 JEI 的验证统一放实机实例（1.18.2-Forge）。
    // ------------------------------------------------------------------
    compileOnly files("libs/jei-api/jei-${jei_baseline_version}.jar")
    jeiModernCompile files("libs/jei-api/jei-${jei_verify_version}.jar")

    // ------------------------------------------------------------------
    // LP 求解器：Apache Commons Math（纯 Java simplex）。
    // implementation：dev 运行期 classpath；
    // shaded：构建时把类**直接解包进模组 jar**（不依赖 JarJar/嵌套 jar）。
    // ------------------------------------------------------------------
    implementation 'org.apache.commons:commons-math3:3.6.1'
    shaded 'org.apache.commons:commons-math3:3.6.1'

    // ------------------------------------------------------------------
    // Gson：core/io 场景 JSON 序列化。
    // compileOnly：运行期由 Minecraft 自带 Gson 提供，避免版本冲突；
    // testImplementation：纯 JVM 测试不启动游戏，必须自己带到 classpath。
    // ------------------------------------------------------------------
    compileOnly "com.google.code.gson:gson:${gson_version}"
    testImplementation "com.google.code.gson:gson:${gson_version}"

    // ------------------------------------------------------------------
    // JUnit 5：core/ 金标准对拍（不启动游戏、不加载 MC 类）。
    // ------------------------------------------------------------------
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---------------------------------------------------------------------------
// jeiModern 源码集：只放「JEI 10.x 才有」的实现（官方配方页按钮 API、装饰器）。
//
// 为什么单独一个源码集：9.x 没有 IRecipeButtonControllerFactory / IRecipeCategoryDecorator，
// 这些类若编译进主源码集会让整个插件编译不过；放进独立源码集后用 10.81 编译，
// 运行时由 JeiCapabilities 探测决定是否加载（9.x 上这些类永远不会被 Class.forName 到）。
// ---------------------------------------------------------------------------
sourceSets {
    jeiModern {
        java.srcDir 'src/jeiModern/java'
        // 平台依赖沿用主源码集，但把「编译基线 JEI」剔除，换成高版本 JEI
        compileClasspath = sourceSets.main.output + configurations.jeiModernCompile +
                configurations.compileClasspath.filter {
                    !it.name.startsWith('jei-1.18.2-')
                }
    }
}

// 把 shaded 库的 class 直接并入模组 jar；排除 META-INF 避免签名/清单冲突。
tasks.named('jar') {
    from({ configurations.shaded.collect { zipTree(it) } }) {
        exclude 'META-INF/**'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    // jeiModern（10.x 专属）只进产物 jar，老版本 JEI 上不会被加载。
    // 不能挂进 sourceSets.main.output —— 那会让 compileJeiModernJava 与 classes 互相依赖。
    dependsOn 'compileJeiModernJava'
    from sourceSets.jeiModern.output
}

// 纯 JVM 测试：不依赖 runClient / MDG 的 dev 运行时。
tasks.named('test') {
    useJUnitPlatform()
    finalizedBy 'deployToTestInstance'
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
        showStackTraces = true
    }
}

// ---------------------------------------------------------------------------
// 实机测试部署：`gradlew test` 结束后把 jar 复制到 HMCL 实例的 mods/。
// 实例路径来自 gradle.properties 的 test_instance_dir；目录不存在时跳过
//（CI / 没有该实例的环境不会失败）。复制前先删掉旧的 recipebalancer-*.jar。
// ---------------------------------------------------------------------------
tasks.register('deployToTestInstance', Copy) {
    // legacy 线在 jar 之后还有一遍 reobfJar（SRG 重映射），它才是 build/libs 里的最终产物；
    // 只依赖 jar 会触发 Gradle 的「隐式依赖」校验错误。
    dependsOn tasks.matching { it.name in ['jar', 'reobfJar'] }
    onlyIf {
        def instance = project.findProperty('test_instance_dir')
        instance != null && !instance.toString().isBlank() && project.file(instance).isDirectory()
    }
    from layout.buildDirectory.file("libs/${mod_id}-${mod_version}.jar")
    into { project.file("${project.findProperty('test_instance_dir')}/mods") }
    doFirst {
        def modsDir = project.file("${project.findProperty('test_instance_dir')}/mods")
        def current = "${mod_id}-${mod_version}.jar"
        // 只清理其它版本的旧 jar；当前版本交给 Copy 覆盖，避免复制失败后实例里一个都不剩
        modsDir.listFiles()?.findAll {
            it.name.startsWith("${mod_id}-") && it.name.endsWith(".jar") && it.name != current
        }?.each { it.delete() }
        logger.lifecycle("[RecipeBalancer] 已部署到实机实例: ${modsDir}")
    }
}

// ---------------------------------------------------------------------------
// 生成模组元数据
//
// ★ filteringCharset = 'UTF-8' 是必须的 ★
// ProcessResources 做占位符替换(expand)时默认用「平台默认编码」，
// 中文 Windows 上是 GBK，会把 UTF-8 模板里的中文转坏（字节被替换成 '?'），
// 产出非法 UTF-8 文件 → FML 解析 mods.toml 时抛
//   MalformedInputException: Input length = 2
// → 游戏报 "File ... is not a valid mod file"
//
//（1.20.1 及以前世代元数据文件名是 META-INF/mods.toml，
//  neoforge.mods.toml 是 1.20.4+ 的名字。）
// ---------------------------------------------------------------------------
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            jei_version_range      : jei_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 让运行任务的子进程输出直接接到 Gradle 控制台。
// 否则游戏崩溃时只会显示"退出码非零"，子进程的 stderr 会被吞掉。
tasks.matching { it.name in ['runClient'] }.configureEach {
    standardOutput = System.out
    errorOutput = System.err
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
