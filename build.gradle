// ===========================================================================
//  RecipeBalancer · MC 1.12.2 + Forge 14.23.5.2859
//
//  这一代的工具链与另外三条线**完全不同**，别照抄：
//    · MDG 没有 1.12.2 通道（legacy 插件官方范围 Forge 1.17–1.20.1）；
//    · RetroFuturaGradle（社区标准）的发布仓库本机不可达；
//    · 剩下就是**官方 MDK 那一套**：ForgeGradle 3 + Gradle 4.9 + JDK 8。
//      同机已验证的配方见 d:/dev/logiscope 的 1.12.2-forge 分支。
//
//  ⚠️ Gradle 4.9 只能在 Java 8 上跑 —— `org.gradle.java.home` 已锁到 jdk-1.8
//  （见 gradle.properties）。不要改成 17/21：Gradle 4.x 在 9+ 上直接起不来。
//  ⚠️ 这一代的 Gradle 没有 `tasks.register` / `configureEach` / `java.toolchain`，
//  也没有 `var`，只能写 4.x 的 `def` + `task xxx` 老语法。
// ===========================================================================
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'
apply plugin: 'idea'

version = mod_version
group = mod_group_id
archivesBaseName = mod_id

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

// 中文 Windows 的默认编码是 GBK，源码 / 语言文件里全是中文 ——
// 不显式指定就会静默转坏（而且报错完全不提编码）。
compileJava.options.encoding = 'UTF-8'
// 移植期一次性看到全部错误（默认 100 条会把后面的文件挡掉）
compileJava.options.compilerArgs += ['-Xmaxerrs', '2000', '-proc:none']
// 移植期关掉增量编译：Gradle 4.9 的增量分析在「先 -PcoreOnly 排除了 mc/**、
// 之后又取消排除」这种切换后会留下错误的 source→class 映射，导致部分类不进编译单元
// （表现为编译时「cannot find symbol: class RbScreen」，而单独 javac 能过）。
compileJava.options.incremental = false

sourceSets.main.resources {
    srcDir 'src/main/resources'
}

// ---------------------------------------------------------------------------
// 移植期门禁：`gradlew test -PcoreOnly`
//
// 只编译 core（以及 core 的测试），用来单独验证「算法在 Java 8 下的结果与其它
// 版本线一致」—— mc 层还没移完时也能跑金标准对拍。正常构建/发布**不加**这个参数。
// ---------------------------------------------------------------------------
if (project.hasProperty('coreOnly')) {
    sourceSets.main.java.exclude 'com/jessetech/recipebalancer/mc/**'
    sourceSets.main.java.exclude 'com/jessetech/recipebalancer/RecipeBalancerMod.java'
    sourceSets.test.java.exclude 'com/jessetech/recipebalancer/mc/**'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
}

minecraft {

    // 1.12.2 没有 Mojang official 映射（official 从 1.14.4 才有），dev 名就是 MCP。
    mappings channel: 'snapshot', version: '20171003-1.12'

    runs {
        client {
            // 各版本线独立 run 目录，切分支互不串味
            workingDirectory project.file('1_12_2_forge')
            property 'forge.logging.markers', 'SCAN,REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

configurations {
    // 只用于「解包进模组 jar」的库；不参与 mod 依赖声明。
    shaded
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'

    // ------------------------------------------------------------------
    // JEI（1.12.2 只有 Forge 侧有；可选依赖）。
    //
    // 编译基线故意选 4.8.5.160：只允许使用该版本就存在的 API，这样同一份代码
    // 在 4.8.5 ~ 4.24 全区间可加载。更低版本（4.7.8.95 起）也能加载，
    // 但缺失的能力走运行期探测降级，并在聊天栏提示升级。
    //
    // compileOnly：JEI 的类不进入产物 jar，未装 JEI 时由能力探测短路。
    // dev 的 runClient 不能用来验证 JEI（JEI 的 config 注册在 userdev 会抛异常），
    // 带 JEI 的验证统一放实机实例（1.12.2-Forge）。
    // ------------------------------------------------------------------
    compileOnly files("libs/jei-api/jei-${jei_baseline_version}.jar")

    // ------------------------------------------------------------------
    // LP 求解器：Apache Commons Math（纯 Java simplex）。
    // implementation：dev 运行期 classpath；
    // shaded：构建时把 jar 作为嵌套库放进产物（1.12.2 用 LaunchWrapper，
    // 理论上可以直接解包，但嵌套 jar + 独立 URLClassLoader 与高版本代码零差异，
    // 先沿用，实测可行后再评估解包）。
    // ------------------------------------------------------------------
    implementation 'org.apache.commons:commons-math3:3.6.1'
    shaded 'org.apache.commons:commons-math3:3.6.1'

    // ------------------------------------------------------------------
    // Gson：core/io 场景 JSON 序列化。
    // 编译基线直接锁「1.12.2 运行期自带的那一份」（libs/gson/gson-2.8.0.jar）。
    // compileOnly：运行期由 Minecraft 提供；testImplementation：纯 JVM 测试自己带。
    // ------------------------------------------------------------------
    compileOnly files("libs/gson/gson-${gson_version}.jar")
    testImplementation files("libs/gson/gson-${gson_version}.jar")

    // ------------------------------------------------------------------
    // JUnit 5：core/ 金标准对拍（不启动游戏、不加载 MC 类）。
    // Gradle 4.9 没有 `platform(...)` BOM 语法，版本必须逐个写死。
    // ------------------------------------------------------------------
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_platform_version}"

    // 只用于 @Nullable 注解（CLASS 保留，不进产物）。
    compileOnly 'org.jetbrains:annotations:23.0.0'
}

// math3 以「jar 内嵌套 jar」的形式随包附带（不是解包合并）。
tasks.withType(Jar) {
    // 见 RecipeBalancerMod：运行期从 <modjar>/recipebalancer/lib/math3.jar 解压加载。
}

jar {
    from(configurations.shaded) {
        into 'recipebalancer/lib'
        rename { 'math3.jar' }
    }
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_group_id,
                "Specification-Version"   : "1",
                "Implementation-Title"    : mod_id,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : mod_group_id,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// FG3 里 `jar` 只打包（MCP 名），`reobfJar` 才重混淆成生产用的 SRG 名。
// 在 IDE 里点一下 `jar` 会把 build/libs 里可用的包换成 dev 版（同名覆盖），
// 所以把 reobf 挂在 jar 后面，出包一律 `gradlew build`。
jar.finalizedBy('reobfJar')

// 纯 JVM 测试：不依赖 runClient / FG3 的 dev 运行时。
test {
    useJUnitPlatform()
    finalizedBy 'deployToTestInstance'
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
        showStackTraces = true
    }
}

// ---------------------------------------------------------------------------
// 实机测试部署：`gradlew test` / `gradlew build` 结束后把 jar 复制到 HMCL 实例的
// mods/。实例路径来自 gradle.properties 的 test_instance_dir；目录不存在时跳过
//（CI / 没有该实例的环境不会失败）。复制前先删掉旧的 recipebalancer-*.jar。
// ---------------------------------------------------------------------------
task deployToTestInstance(type: Copy) {
    dependsOn 'reobfJar'
    onlyIf {
        def instance = project.findProperty('test_instance_dir')
        instance != null && !instance.toString().trim().isEmpty() && project.file(instance).isDirectory()
    }
    from "$buildDir/libs/${mod_id}-${mod_version}.jar"
    into { project.file("${project.findProperty('test_instance_dir')}/mods") }
    doFirst {
        def modsDir = project.file("${project.findProperty('test_instance_dir')}/mods")
        def current = "${mod_id}-${mod_version}.jar"
        // 只清理其它版本的旧 jar；当前版本交给 Copy 覆盖，避免复制失败后实例里一个都不剩
        modsDir.listFiles()?.findAll {
            it.name.startsWith("${mod_id}-") && it.name.endsWith(".jar") && it.name != current
        }?.each { it.delete() }
        logger.lifecycle("[RecipeBalancer] 已部署到实机实例: ${modsDir}")
    }
}

// ---------------------------------------------------------------------------
// mcmod.info 的占位符展开
//
// ★ filteringCharset = 'UTF-8' 是必须的（与另外三条线的 mods.toml 同一个坑）：
//   占位符替换默认用平台编码，中文 Windows 是 GBK，会把 UTF-8 的中文描述转坏，
//   于是 FML 读到非法 UTF-8 → 模组列表里那一行变成乱码 / 启动报错。
// ---------------------------------------------------------------------------
processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft_version
    inputs.property 'jeirange', project.jei_loadable_version_range

    filteringCharset = 'UTF-8'

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version'      : project.version,
                'mcversion'   : project.minecraft_version,
                'jeirange'    : project.jei_loadable_version_range
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// 让 runClient 的子进程输出直接接到 Gradle 控制台。
// 否则游戏崩溃时只会显示「退出码非零」，子进程的 stderr 会被吞掉。
tasks.matching { it.name in ['runClient'] }.all {
    standardOutput = System.out
    errorOutput = System.err
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

