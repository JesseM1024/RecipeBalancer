# 构建时花括号形式的占位符会被 gradle.properties 的值替换
# （本注释刻意不写出完整占位符，否则会被 expand 当成占位符处理）。
# 最终产物在 build/generated/sources/modMetadata/META-INF/mods.toml
# （1.20.1 世代文件名为 mods.toml；1.20.4+ 起改名为 neoforge.mods.toml。）

modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
logoFile="icon.png" #模组列表图标（resources/icon.png）
description='''
产线配平自动计算器（纯客户端）。
按下快捷键打开图形界面，可视化录入配方，用线性规划求解各配方稳态速率与机器并行数，
支持循环配方与启动投料计算。

本 1.20.1 版本暂不提供 JEI 快捷功能（JEI 配方页按钮、书签导入、拖拽取物品等），
其余录入与求解功能完整可用，详见游戏内提示。

A client-side production line balancer.
Press the hotkey to open the GUI and enter recipes, then solve steady-state recipe rates
and machine parallels via linear programming, with cyclic recipe and bootstrap inventory support.

This 1.20.1 build temporarily ships without the JEI shortcuts (recipe-page buttons,
bookmark import, drag-and-drop ingredient picking); all other editing and solving
features are fully available.
'''

# 依赖只在客户端校验（side="CLIENT"）：服务端不会因缺少本模组而报错。
# 主类在构造器里检查 FMLEnvironment.dist，非客户端环境直接跳过全部注册。
#
# ★ 加载器适用范围 ★
# 1.20.1 世代的平台 modId 是 "forge"：NeoForge 1.20.1 是 Forge 47.x 的分支，
# 包名仍是 net.minecraftforge.*，且沿用 "forge" 这个 modId。
# 因此本 jar【同时适用于 Forge 1.20.1 与 NeoForge 1.20.1】，无需分别打包。
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
