# 构建时，本文件中的占位符会被 gradle.properties 的值替换。
# 最终产物在 build/generated/sources/modMetadata/META-INF/mods.toml
#（1.20.1 及以前世代文件名为 mods.toml；1.20.4+ 起改名为 neoforge.mods.toml。）

modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
logoFile="icon.png" #模组列表图标；文件在 jar 根（src/main/resources/icon.png）
description='''
产线配平自动计算器（纯客户端）。
按下快捷键打开图形界面，可视化录入配方，用线性规划求解各配方稳态速率与机器并行数，
支持循环配方与启动投料计算。

A client-side production line balancer.
Press the hotkey to open the GUI, visually enter recipes, then solve steady-state
recipe rates and machine parallels via linear programming, with cyclic recipe
and bootstrap inventory support.
'''

# 纯客户端模组：依赖只在客户端校验。
# 服务端即使未安装本模组也不会报错（配合主类的 FMLEnvironment.dist 检查）。
# 1.18.2 为 Forge 血统：依赖字段用 mandatory=true（type="required" 为 20.2+ 写法）；
# 平台依赖 modId 为 "forge"（这一代没有 NeoForge）。
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
