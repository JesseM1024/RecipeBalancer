# ============================================================
#  Gradle 运行时
# ============================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 锁定守护进程 JDK，避免误用系统默认的 JDK 25
# （1.20.1 = Java 17；main 线 1.21.1 用的是 jdk-21）
org.gradle.java.home=C:/Program Files/Java/jdk-17

# ============================================================
#  版本 —— 1.20.1 分支
#  编译目标：NeoForge 1.20.1-47.1.106（1.20.1 世代较早的加载器版本，
#  用它编译；再由加载器版本更高的测试实例验证兼容性）。
#  1.20.1 世代的 NeoForge 是 Forge 47.x 的分支，包名仍是 net.minecraftforge.*，
#  所以同一份代码/同一个 jar 同时适用于 Forge 1.20.1 与 NeoForge 1.20.1。
#  测试实例：.minecraft/versions/1.20.1-NeoForge、1.20.1-Forge
# ============================================================
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
# legacy 插件要求带 MC 前缀的完整版本号（net.neoforged:forge:1.20.1-47.1.106）
neo_version=1.20.1-47.1.106
# mods.toml 里对平台 mod（1.20.1 世代 modId 仍叫 "forge"）的依赖范围
neo_version_range=[47,)
# 1.20.1 世代 FML 语言加载器大版本是 47
loader_version_range=[47,)

# JEI（1.20.1 只有 Forge 侧发布）。
# 编译基线 15.3.0.8：这是我们用到的最「年轻」的公共 API 集合
#（IRecipeCategoryDecorator 在本地样本里 15.0.0.12 没有、15.3.0.8 有；精确引入版本未验证）。
# 因此 15.0~15.2 上「配方页按钮」不可用，其余能力照常。
# 运行时最低支持 15.0.0.12：缺接口的能力会自行降级，其余功能正常。
jei_baseline_version=15.3.0.8
# 实机验证用的最新版本（仅记录；jeiModern 源码集用它编译）
jei_verify_version=15.74.0.233
# mods.toml 里的可选依赖范围：未装 JEI 时 JEI 相关功能整体降级，其余功能不受影响
jei_version_range=[15.0.0.12,)

# 实机测试实例（HMCL）：`gradlew test`/`build` 结束后自动把构建出的 jar 复制到
# 每个实例的 mods/，并删掉其中旧版本的 recipebalancer-*.jar。
# 用分号（或逗号）并列多个实例；不存在的实例会跳过。
#   1.20.1-NeoForge ：NeoForge 1.20.1 实例
#   1.20.1-Forge    ：Forge 1.20.1 实例（同一个 jar 的双加载器验证）
test_instance_dirs=C:/Users/JesseTech/Desktop/JesseTech/exe/waterdrop/.minecraft/versions/1.20.1-NeoForge;C:/Users/JesseTech/Desktop/JesseTech/exe/waterdrop/.minecraft/versions/1.20.1-Forge

# 测试与 JSON：core/io 用 Gson（编译期 + 测试），单测用 JUnit 5（纯 JVM）。
# Gson 选 2.10.1：本机 ~/.gradle 缓存已有该版本（可离线构建）。
gson_version=2.10.1
junit_version=5.10.2

# ============================================================
#  模组元信息
# ============================================================
mod_id=recipebalancer
mod_name=RecipeBalancer
mod_license=MIT
# 版本号约定：mod_version 后缀必须带 MC 版本，避免多版本线 jar 混装。
# 1.20.1 分支：0.1.5a 首版；0.1.6 加入配方集「打开文件夹」与 JEI 集成（JEI 只有 1.20.1 Forge 版，
# NeoForge 1.20.1 实例未装 JEI 时相关功能整体降级）。
mod_version=0.2.0a-1.20.1
mod_group_id=com.jessetech.recipebalancer
