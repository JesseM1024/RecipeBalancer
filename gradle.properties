# ============================================================
#  Gradle 运行时
# ============================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 锁定守护进程 JDK，避免误用系统默认的 JDK 25
org.gradle.java.home=C:/Program Files/Java/jdk-21

# ============================================================
#  版本 —— 与本地实例严格对齐
#  目标实例：versions/NAST hard d0.9.5（MC 1.21.1 + NeoForge 21.1.209）
#  版本组合与 D:\dev\logiscope 一致，可全量复用 ~/.gradle 依赖缓存。
# ============================================================
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.209
loader_version_range=[4,)

# JEI：开发环境锁定在仍接受 NeoForge 21.1.209 的最后一个版本。
# 19.39.0.372 的 mods.toml 声明 neoforge [21.0.118-beta,)；
# 19.42.0.389 起改为 [21.1.238,)，在 21.1.209 下会直接报版本错误。
# 实机实例已升级 NeoForge 21.1.246 + JEI 19.70.0.460，满足本模组 `[19.39.0,)` 的可选依赖范围。
jei_version=19.39.0.372

# 实机测试实例（HMCL）：`gradlew test` 结束后自动把构建出的 jar 复制到
# <test_instance_dir>/mods，并把旧的 recipebalancer-*.jar 删掉。
test_instance_dir=C:/Users/JesseTech/Desktop/JesseTech/exe/waterdrop/.minecraft/versions/1.21.1-NeoForge

# 测试与 JSON：core/io 用 Gson（编译期 + 测试），单测用 JUnit 5（纯 JVM）。
# Gson 选 2.10.1：本机 ~/.gradle 缓存已有该版本，且与 NeoForge 自带版本同代。
gson_version=2.10.1
junit_version=5.10.2

# ============================================================
#  模组元信息
# ============================================================
mod_id=recipebalancer
mod_name=RecipeBalancer
mod_license=MIT
# 版本号约定：mod_version 后缀必须带 MC 版本，避免多版本线 jar 混装。
mod_version=0.1.1-1.21.1
mod_group_id=com.jessetech.recipebalancer
