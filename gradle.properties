# ============================================================
#  Gradle 运行时
# ============================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 锁定守护进程 JDK：Gradle 7.6 跑不了 JDK 21/25，用 jdk-17；
# 编译目标由 build.gradle 的 toolchain 锁到 Java 8（1.16.5 是 Java 8 世代）。
org.gradle.java.home=C:/Program Files/Java/jdk-17

# ============================================================
#  版本
#  1.16.5 只存在 Forge 一家（NeoForge 首个版本是 1.20.1），
#  平台依赖的 modId 就是 "forge"。
# ============================================================
minecraft_version=1.16.5
minecraft_version_range=[1.16.5]
# ForgeGradle 5 要求带 MC 前缀的完整版本号（net.minecraftforge:forge:1.16.5-36.2.42）
forge_version=1.16.5-36.2.42
# mods.toml 里对平台 mod 的依赖范围：下界取 36（1.16.5 线起点），
# 不取编译用的 36.2.42，否则 36.0.x / 36.1.x 的整合包会被 FML 直接拒载。
forge_version_range=[36,)
# 1.16.5 世代 FML 语言加载器（javafml）大版本是 36
loader_version_range=[36,)

# ============================================================
#  JEI（1.16.5 只有 Forge 侧有；可选依赖）
#  compileOnly 基线：7.6.1.75（本地 .jei-ver 里 1.16.5 线最老样本）
#  验证样本：7.8.1.1018（实例当前版本）
# ============================================================
jei_baseline_version=1.16.5-7.6.1.75
jei_verify_version=1.16.5-7.8.1.1018
# mods.toml 的可选依赖范围：从 1.16.5 线最老样本起
jei_version_range=[7.6.1.75,)

# 实机测试实例（HMCL）：`gradlew test` 结束后自动把构建出的 jar 复制到
# <test_instance_dir>/mods，并把旧的 recipebalancer-*.jar 删掉。
# 目录不存在时自动跳过（不改也没关系）。
test_instance_dir=C:/Users/JesseTech/Desktop/JesseTech/exe/waterdrop/.minecraft/versions/1.16.5-Forge

# 测试与 JSON：core/io 用 Gson（编译期 + 测试），单测用 JUnit 5（纯 JVM）。
# 必须与 1.16.5 运行期自带的 Gson 一致（实例 libraries 里是 2.8.0）。
# 用更高版本编译会悄悄引用 2.8.6+ 才有的静态方法（如 JsonParser.parseString），
# 运行时 NoSuchMethodError。改这里之前先确认目标 MC 版本自带的 Gson。
gson_version=2.8.0
junit_version=5.10.2

# ============================================================
#  模组元信息
# ============================================================
mod_id=recipebalancer
mod_name=RecipeBalancer
mod_license=MIT
# 版本号约定：mod_version 后缀必须带 MC 版本，避免多版本线 jar 混装。
mod_version=0.3.1-1.16.5
mod_group_id=com.jessetech.recipebalancer
