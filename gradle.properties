# ============================================================
#  Gradle 运行时
# ============================================================
# user.language=en：javac 的报错用英文（中文控制台里 GBK/UTF-8 混排会把报错糊成乱码，
# 移植期要看错误清单，英文最稳）。file.encoding=UTF-8：日志按 UTF-8 写出。
org.gradle.jvmargs=-Xmx3G -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
# 官方 MDK 也是 false：1.12.2 的反编译流程很吃内存，守护进程留着容易 OOM。
org.gradle.daemon=false

# Gradle 4.9 的守护进程**必须**跑在 Java 8 上（Gradle 4.x 不支持 11+）。
# 编译目标同样是 1.8（build.gradle 里的 sourceCompatibility）。
org.gradle.java.home=C:/Program Files/Java/jdk-1.8

# ============================================================
#  版本 —— 与本地实例严格对齐
#  1.12.2 这一代只有 Forge 一家（NeoForge 首个版本是 1.20.1），平台 modId 就是 "forge"。
#  Forge 14.23.5.2859 是 1.12.2 的最后一个版本，也是社区事实标准。
# ============================================================
minecraft_version=1.12.2
forge_version=1.12.2-14.23.5.2859
mc_version_range=[1.12.2]

# ============================================================
#  JEI（1.12.2 只有 Forge 侧有；可选依赖）
#
#  编译基线 4.8.5.160：IGhostIngredientHandler / IGuiScreenHandler / IGuiProperties
#  从 4.8.4.131 起才有，GuiIngredient#getRect 从 4.8.5.160 起才有 —— 低于这个版本
#  这些 API 在编译期就不存在，所以主源码集里只能引用 4.8.5.160 已有的类。
#
#  加载下限 4.7.8.95：插件入口只实现 IModPlugin（4.7.9.96 起就有），所有 4.8.4+
#  的能力注册都放在独立类里、由运行期探测决定是否加载；低于 4.8.5.160 时首次进入
#  世界会在聊天栏提示升级（见 docs/JEI-COMPAT-1.12.2.md）。
# ============================================================
jei_baseline_version=1.12.2-4.8.5.160
jei_loadable_version_range=[4.7.8,)
jei_full_version_range=[4.8.5.160,)

# 实机测试实例（HMCL）：`gradlew test` / `gradlew build` 结束后把 jar 复制到
# <test_instance_dir>/mods，并把旧的 recipebalancer-*.jar 删掉。
# 目录不存在时自动跳过（CI / 没有该实例的环境不会失败）。
test_instance_dir=C:/Users/JesseTech/Desktop/JesseTech/exe/waterdrop/.minecraft/versions/1.12.2-Forge

# 测试与 JSON：core/io 用 Gson（编译期 + 测试），单测用 JUnit 5（纯 JVM）。
# 必须与 1.12.2 运行期自带的 Gson 一致（MC 1.12.2 是 2.8.0）。
# 用更高版本编译会悄悄引用 2.8.6+ 才有的静态方法，运行时 NoSuchMethodError。
gson_version=2.8.0
junit_version=5.10.2
junit_platform_version=1.10.2

# ============================================================
#  模组元信息
# ============================================================
mod_id=recipebalancer
mod_name=RecipeBalancer
mod_license=MIT
# 版本号约定：mod_version 后缀必须带 MC 版本，避免多版本线 jar 混装。
mod_version=0.4.0-1.12.2
mod_group_id=com.jessetech.recipebalancer
