# ============================================================
#  Gradle 运行时
# ============================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 锁定守护进程 JDK，避免误用系统默认的 JDK 25
# （1.18.2 是 Java 17；main 线 1.21.1 用 jdk-21）
org.gradle.java.home=C:/Program Files/Java/jdk-17

# ============================================================
#  版本
#  1.18.2 只存在 Forge 一家（NeoForge 首个版本是 1.20.1），
#  平台依赖的 modId 就是 "forge"。
# ============================================================
minecraft_version=1.18.2
minecraft_version_range=[1.18.2]
# legacy 插件要求带 MC 前缀的完整版本号（net.minecraftforge:forge:1.18.2-40.3.12）
forge_version=1.18.2-40.3.12
# mods.toml 里对平台 mod 的依赖范围：下界取 40.2（1.18.2 线起点），
# 不取编译用的 40.3.12，否则 40.2.x 的整合包会被 FML 直接拒载。
forge_version_range=[40.2,)
# 1.18.2 世代 FML 语言加载器（javafml）大版本是 40
loader_version_range=[40,)

# 实机测试实例（HMCL）：`gradlew test` 结束后自动把构建出的 jar 复制到
# <test_instance_dir>/mods，并把旧的 recipebalancer-*.jar 删掉。
# 目录不存在时自动跳过（不改也没关系）。
test_instance_dir=C:/Users/JesseTech/Desktop/JesseTech/exe/waterdrop/.minecraft/versions/1.18.2-Forge

# 测试与 JSON：core/io 用 Gson（编译期 + 测试），单测用 JUnit 5（纯 JVM）。
gson_version=2.10.1
junit_version=5.10.2

# ============================================================
#  模组元信息
# ============================================================
mod_id=recipebalancer
mod_name=RecipeBalancer
mod_license=MIT
# 版本号约定：mod_version 后缀必须带 MC 版本，避免多版本线 jar 混装。
mod_version=0.2.0-1.18.2
mod_group_id=com.jessetech.recipebalancer
