# ============================================================
#  Gradle 运行时
# ============================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 锁定守护进程 JDK，避免误用系统默认的 JDK 25
org.gradle.java.home=C:/Program Files/Java/jdk-21

# ============================================================
#  版本 —— 与本地实例严格对齐
#  目标实例：versions/NAST hard d0.9.5（MC 1.21.1 + NeoForge 21.1.209）
#  版本组合与 D:\dev\logiscope 一致，可全量复用 ~/.gradle 依赖缓存。
# ============================================================
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.209
loader_version_range=[4,)

# JEI：与 NAST hard 实例中实际安装的版本严格一致（jei-1.21.1-neoforge-19.44.0.405.jar）
jei_version=19.44.0.405

# ============================================================
#  模组元信息
# ============================================================
mod_id=recipebalancer
mod_name=RecipeBalancer
mod_license=MIT
# 版本号约定：mod_version 后缀必须带 MC 版本，避免多版本线 jar 混装。
mod_version=0.1.0-1.21.1
mod_group_id=com.jessetech.recipebalancer
